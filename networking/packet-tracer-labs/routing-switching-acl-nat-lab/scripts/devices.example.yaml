# Copy this to devices.yaml and fill in real credentials/addresses.
# Never commit devices.yaml with real passwords -- keep it out of git
# (add "devices.yaml" to .gitignore) and use devices.example.yaml as the
# checked-in reference for the expected structure.
#
# Only include the devices you can actually reach -- you don't need all 8
# for a partial check (see --device to target just one).
#
# ⚠️ About the "password" fields below: as currently built, this lab's devices
# don't have remote login configured at all -- no VTY password, no SSH, no
# local username. The "line vty 0 4 / login" on each device actively refuses
# any connection attempt until that changes. So the values below are NOT real
# credentials sitting unused, and they're not "fill in the blank" secrets
# either -- they're placeholders for a login mechanism that doesn't exist yet
# in this topology. If you enable VTY/SSH access on the devices later, update
# these to match whatever you configure there; until then, this file
# documents the *shape* verify_lab.py expects, not something ready to run
# against the lab as-is.

devices:
  BORDER:
    device_type: cisco_ios
    host: 100.100.0.1
    username: admin
    password: no-login-configured
    secret: no-login-configured   # enable password, if required

  L3SW1:
    device_type: cisco_ios
    host: 100.200.0.2
    username: admin
    password: no-login-configured

  L3SW2:
    device_type: cisco_ios
    host: 100.100.0.2
    username: admin
    password: no-login-configured

  SW1:
    device_type: cisco_ios
    host: 192.168.100.2
    username: admin
    password: no-login-configured

  SW2:
    device_type: cisco_ios
    host: 192.168.200.2
    username: admin
    password: no-login-configured
